name: Sync Upstream

on:
  schedule:
    # Run daily at 4 AM UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI

permissions:
  contents: write # To checkout, commit, and push changes
  pull-requests: write # To create pull requests
  actions: write # To dispatch the Claude fix workflow

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    if: github.repository == 'mariusgassen/mealie'
    env:
      UPSTREAM_REPO: https://github.com/mealie-recipes/mealie.git
      BASE_BRANCH: mealie-next
      # The secrets context isn't available in step-level `if`, so expose it via env
      HAS_APP_TOKEN: ${{ secrets.COMMIT_BOT_APP_ID != '' }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COMMIT_BOT_APP_ID }}
          private-key: ${{ secrets.COMMIT_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$BASE_BRANCH"

      - name: Check for upstream changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/"$BASE_BRANCH" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into sync branch
        id: merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="upstream-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          if git merge upstream/"$BASE_BRANCH" --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # Commit the conflict markers so the PR can be opened; Claude resolves them afterwards
            git add -A
            git commit --no-edit
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Push branch and create PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          BRANCH_NAME: ${{ steps.merge.outputs.branch_name }}
        run: |
          git push origin "$BRANCH_NAME"

          sleep 2

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore: sync with upstream mealie-recipes/mealie" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --body "Automated merge of the latest changes from [mealie-recipes/mealie](https://github.com/mealie-recipes/mealie) into \`$BASE_BRANCH\`.

          This branch merges upstream's commits in as-is (a merge commit, not a squash or rebase), so each upstream commit stays intact and individually visible in history. Auto-merge is queued using **\"Create a merge commit\"** so that holds once this PR merges; if auto-merge doesn't fire (e.g. it isn't enabled on this repo, or branch protection needs a manual review), merge it yourself with that same method — not squash or rebase, which would collapse upstream's commits into one.")

          echo "Opened $PR_URL"

          # PRs opened with GITHUB_TOKEN don't trigger workflows, so dispatch the Claude check explicitly.
          # Use github.token here: the `actions: write` permission above applies to it, not to the app token.
          GH_TOKEN="${{ github.token }}" gh workflow run claude-upstream-sync.yml --repo "${{ github.repository }}" -f pr_number="${PR_URL##*/}"

          if [ "$CONFLICT" = "true" ]; then
            echo "::warning::Merge conflicts committed on $PR_URL; Claude will resolve them. Not enabling auto-merge."
            exit 0
          fi

          if ! gh pr merge "$PR_URL" --auto --merge; then
            echo "::warning::Could not enable auto-merge on $PR_URL (auto-merge may not be enabled for this repo, or a review is required). Merge it manually using \"Create a merge commit\"."
          fi

      - name: No changes detected
        if: steps.check.outputs.has_changes == 'false'
        run: echo "No new upstream commits, skipping sync"
