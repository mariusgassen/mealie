name: Docker Nightly Production

on:
  push:
    branches:
      - mealie-next
    paths-ignore:
      - '*.md'
      - '.devcontainer/**'
      # I'm not excluding .github as changes in there might be to workflows etc
      - '.vscode/**'
      - 'docs/**'

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: "Backend Server Tests"
    uses: ./.github/workflows/test-backend.yml

  frontend-tests:
    name: "Frontend Tests"
    uses: ./.github/workflows/test-frontend.yml

  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    with:
      tag: nightly

  publish:
    permissions:
      contents: read
      packages: write
      # The id-token write permission is needed to connect to Depot.dev
      # as part of the partial-builder.yml action. It needs to be declared
      # in the parent action, as noted here:
      # https://github.com/orgs/community/discussions/76409#discussioncomment-8131390
      id-token: write
    name: Build Tagged Release
    if: github.repository == 'mealie-recipes/mealie'
    uses: ./.github/workflows/publish.yml
    needs:
      - frontend-tests
      - backend-tests
      - build-package
    with:
      tag: nightly
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-fork:
    name: Build and push nightly image (ghcr.io)
    # Forks don't have the Docker Hub/Depot secrets that publish.yml needs, so
    # push a ghcr.io-only image here instead, using only GITHUB_TOKEN.
    if: github.repository != 'mealie-recipes/mealie'
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - backend-tests
      - build-package
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          build-contexts: |
            packages=dist
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            COMMIT=${{ github.sha }}

  notify-discord:
    name: Notify Discord
    if: github.repository == 'mealie-recipes/mealie'
    needs:
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "🚀  New builds of ghcr.io/mealie-recipes/mealie:nightly"
