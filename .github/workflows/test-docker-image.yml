name: Build Test Docker Image

# Builds docker/Dockerfile from a branch or PR and pushes it to ghcr.io so it can be
# pulled and run anywhere (a server, Coolify, a local machine) for manual testing.
# Unlike publish.yml, this only needs GITHUB_TOKEN (no DockerHub/Depot secrets), so it
# works on a personal fork.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to the branch this workflow runs from)"
        required: false
        type: string
  pull_request:

concurrency:
  group: test-docker-image-${{ github.event.pull_request.head.sha || inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ inputs.ref || github.ref_name }}"
            echo "tag=$(echo "$ref" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          build-args: |
            COMMIT=${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Print pull instructions
        run: |
          echo "### Test image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "docker run -d --name mealie-test -p 9091:9000 ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
